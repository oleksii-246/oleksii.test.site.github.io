<script>
var memory=0;
var operation;

function numberClick(a) {
	document.f.in.value=a.innerHTML; 
	if (operation=="+") {
		memory = memory+a.innerHTML*1;
	} else if (operation=="-") {
		memory = memory-a.innerHTML*1;
	} else {
		memory = memory*10+a.innerHTML*1;
		document.f.in.value=memory;
	}	
}

function plusClick() {
	operation="+";
}
function minusClick() {
	operation="-"
}
